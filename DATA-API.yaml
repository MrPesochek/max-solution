schemaVersion: "1.0"

solution:
  name: "Сервис ремонта оборудования в MAX"
  teamId: "CU-company"

api:
  baseUrl: "https://hakathon.baseclub.lol"
  openapi: "./openapi/data-api.json"
  defaultHeaders:
    Accept: "application/json"
    Authorization: "Bearer max_7d8hdiwh"

checks:
  - id: "health"
    name: "Доступность API"
    method: "GET"
    path: "/healthz"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "ok"}
    timeoutMs: 5000
    repeatable: true

  - id: "app-auth-required"
    name: "Отказ при запросе без сессии"
    method: "GET"
    path: "/app-api/v1/me"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["error"]
      bodySchema:
        type: "object"
        required: ["error"]
        properties:
          error:
            type: "object"
            required: ["code", "message", "request_id"]
            properties:
              code: {const: "UNAUTHENTICATED"}
    timeoutMs: 5000
    repeatable: true

  - id: "login-customer-employee"
    name: "Вход сотрудника заказчика"
    description: >-
      Для локального стенда с APP_ENV=local и DEMO_LOGIN_ENABLED=true.
      На опубликованном стенде этот способ входа выключен.
      Токен сотрудника и ID организации используются в следующих проверках.
    method: "POST"
    path: "/app-api/v1/auth/demo"
    role: "public"
    request:
      headers:
        Content-Type: "application/json"
      body:
        user_key: "employee"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["token", "expires_at", "user", "memberships"]
      bodySchema:
        type: "object"
        required: ["token", "expires_at", "user", "memberships"]
        properties:
          memberships:
            type: "array"
            minItems: 1
            items:
              type: "object"
              required: ["organization", "role"]
            prefixItems:
              - type: "object"
                properties:
                  role: {const: "customer_employee"}
    timeoutMs: 5000
    repeatable: true
    extract:
      customerToken: "$.token"
      customerOrganizationId: "$.memberships[0].organization.id"
      runMarker: "$.expires_at"

  - id: "login-customer-outsider"
    name: "Вход пользователя другой организации"
    method: "POST"
    path: "/app-api/v1/auth/demo"
    role: "public"
    request:
      headers:
        Content-Type: "application/json"
      body:
        user_key: "outsider_manager"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["token", "memberships"]
      bodySchema:
        type: "object"
        properties:
          memberships:
            type: "array"
            minItems: 1
            prefixItems:
              - type: "object"
                properties:
                  role: {const: "customer_manager"}
    timeoutMs: 5000
    repeatable: true
    extract:
      outsiderToken: "$.token"
      outsiderOrganizationId: "$.memberships[0].organization.id"

  - id: "login-provider-admin"
    name: "Вход администратора сервиса"
    method: "POST"
    path: "/app-api/v1/auth/demo"
    role: "public"
    request:
      headers:
        Content-Type: "application/json"
      body:
        user_key: "provider_admin"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["token", "memberships"]
      bodySchema:
        type: "object"
        properties:
          memberships:
            type: "array"
            minItems: 1
            prefixItems:
              - type: "object"
                properties:
                  role: {const: "provider_admin"}
    timeoutMs: 5000
    repeatable: true
    extract:
      providerToken: "$.token"
      providerOrganizationId: "$.memberships[0].organization.id"

  - id: "me"
    name: "Профиль и членство сотрудника заказчика"
    method: "GET"
    path: "/app-api/v1/me"
    role: "customer_employee"
    dependsOn: ["login-customer-employee"]
    request:
      headers:
        Authorization: "Bearer ${customerToken}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["user", "memberships", "organizations"]
      bodySchema:
        type: "object"
        properties:
          user:
            type: "object"
            required: ["id", "display_name"]
          memberships:
            type: "array"
            minItems: 1
            prefixItems:
              - type: "object"
                required: ["organization"]
                properties:
                  role: {const: "customer_employee"}
    timeoutMs: 5000
    repeatable: true

  - id: "equipment-list"
    name: "Оборудование доступной точки сотрудника"
    method: "GET"
    path: "/app-api/v1/equipment"
    role: "customer_employee"
    dependsOn: ["login-customer-employee"]
    request:
      query:
        limit: 20
      headers:
        Authorization: "Bearer ${customerToken}"
        X-Organization-Id: "${customerOrganizationId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["items"]
      bodySchema:
        type: "object"
        properties:
          items:
            type: "array"
            minItems: 1
            items:
              type: "object"
              required: ["id", "location_id"]
    timeoutMs: 5000
    repeatable: true
    extract:
      equipmentId: "$.items[0].id"

  - id: "request-create"
    name: "Черновик заявки своему сервису"
    method: "POST"
    path: "/app-api/v1/requests"
    role: "customer_employee"
    dependsOn: ["equipment-list"]
    request:
      headers:
        Authorization: "Bearer ${customerToken}"
        X-Organization-Id: "${customerOrganizationId}"
        Idempotency-Key: "data-api-create-${runMarker}"
        Content-Type: "application/json"
      body:
        equipment_id: "${equipmentId}"
        route: "own_service"
        urgency: "normal"
        symptom_description: "Проверка DATA-API: камера не держит температуру."
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "request_number", "version", "status", "equipment", "location"]
      bodySchema:
        type: "object"
        required: ["id", "version", "status", "route", "urgency"]
        properties:
          status: {const: "draft"}
          route: {const: "own_service"}
          urgency: {const: "normal"}
          version: {type: "integer"}
    timeoutMs: 5000
    repeatable: false
    extract:
      requestId: "$.id"
      requestVersion: "$.version"

  - id: "request-create-replay"
    name: "Повтор запроса без создания дубля"
    method: "POST"
    path: "/app-api/v1/requests"
    role: "customer_employee"
    dependsOn: ["request-create"]
    request:
      headers:
        Authorization: "Bearer ${customerToken}"
        X-Organization-Id: "${customerOrganizationId}"
        Idempotency-Key: "data-api-create-${runMarker}"
        Content-Type: "application/json"
      body:
        equipment_id: "${equipmentId}"
        route: "own_service"
        urgency: "normal"
        symptom_description: "Проверка DATA-API: камера не держит температуру."
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "version", "status"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "draft"}
    timeoutMs: 5000
    repeatable: true

  - id: "submit-stale-version"
    name: "Отказ при устаревшей версии заявки"
    method: "POST"
    path: "/app-api/v1/requests/{request_id}/actions/submit-to-own-service"
    role: "customer_employee"
    dependsOn: ["request-create"]
    request:
      path:
        request_id: "${requestId}"
      headers:
        Authorization: "Bearer ${customerToken}"
        X-Organization-Id: "${customerOrganizationId}"
        Idempotency-Key: "data-api-submit-stale-${runMarker}"
        Content-Type: "application/json"
      body:
        expected_version: 0
        photos_incomplete: true
        photos_incomplete_reason: "Проверка DATA-API: фото не прикладываются"
    expected:
      statusCodes: [409]
      contentType: "application/json"
      requiredFields: ["error"]
      bodySchema:
        type: "object"
        required: ["error"]
        properties:
          error:
            type: "object"
            required: ["code", "message", "request_id", "details"]
            properties:
              code: {const: "VERSION_CONFLICT"}
              details:
                type: "object"
                required: ["current_version"]
                properties:
                  current_version: {type: "integer"}
    timeoutMs: 5000
    repeatable: true

  - id: "submit-to-own-service"
    name: "Отправка заявки подключённому сервису с актуальной версией"
    method: "POST"
    path: "/app-api/v1/requests/{request_id}/actions/submit-to-own-service"
    role: "customer_employee"
    dependsOn: ["request-create"]
    request:
      path:
        request_id: "${requestId}"
      headers:
        Authorization: "Bearer ${customerToken}"
        X-Organization-Id: "${customerOrganizationId}"
        Idempotency-Key: "data-api-submit-${runMarker}"
        Content-Type: "application/json"
      body:
        expected_version: "${requestVersion}"
        photos_incomplete: true
        photos_incomplete_reason: "Проверка DATA-API: фото не прикладываются"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "version", "status", "submitted_at", "assignment"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "awaiting_provider"}
          assignment:
            type: "object"
            required: ["id", "state"]
            properties:
              state: {const: "pending"}
    timeoutMs: 5000
    repeatable: false

  - id: "outsider-cannot-read"
    name: "Заявка недоступна чужой организации"
    method: "GET"
    path: "/app-api/v1/requests/{request_id}"
    role: "customer_outsider"
    dependsOn: ["login-customer-outsider", "request-create"]
    request:
      path:
        request_id: "${requestId}"
      headers:
        Authorization: "Bearer ${outsiderToken}"
        X-Organization-Id: "${outsiderOrganizationId}"
    expected:
      statusCodes: [404]
      contentType: "application/json"
      requiredFields: ["error"]
      bodySchema:
        type: "object"
        properties:
          error:
            type: "object"
            properties:
              code: {const: "NOT_FOUND"}
    timeoutMs: 5000
    repeatable: true

  - id: "crm-issue-key"
    name: "Выпуск ключа CRM"
    method: "POST"
    path: "/app-api/v1/integration/api-keys"
    role: "provider_admin"
    dependsOn: ["login-provider-admin"]
    request:
      headers:
        Authorization: "Bearer ${providerToken}"
        X-Organization-Id: "${providerOrganizationId}"
        Idempotency-Key: "data-api-issue-key-${runMarker}"
        Content-Type: "application/json"
      body:
        name: "Проверка DATA-API"
        scopes: ["requests:read", "requests:write", "events:read"]
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "key", "key_prefix", "scopes", "status"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "active"}
    timeoutMs: 5000
    repeatable: false
    extract:
      integrationApiKey: "$.key"
      integrationClientId: "$.id"

  - id: "jury-api-access"
    name: "Доступ жюри к интеграционному API"
    method: "GET"
    path: "/api/v1/me"
    role: "jury"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["organization_id", "organization_name", "client_id", "key_prefix", "scopes"]
      bodySchema:
        type: "object"
        required: ["organization_id", "client_id", "scopes"]
        properties:
          key_prefix: {const: "7d8hdiwh"}
          scopes:
            type: "array"
            minItems: 1
    timeoutMs: 5000
    repeatable: true

  - id: "crm-me"
    name: "Ключ интеграции: организация и scopes"
    method: "GET"
    path: "/api/v1/me"
    role: "integration_client"
    dependsOn: ["crm-issue-key"]
    request:
      headers:
        Authorization: "Bearer ${integrationApiKey}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["organization_id", "organization_name", "client_id", "key_prefix", "scopes"]
    timeoutMs: 5000
    repeatable: true

  - id: "crm-list-requests"
    name: "Входящие заявки исполнителя"
    method: "GET"
    path: "/api/v1/requests"
    role: "integration_client"
    dependsOn: ["crm-issue-key"]
    request:
      query:
        limit: 50
      headers:
        Authorization: "Bearer ${integrationApiKey}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["items"]
    timeoutMs: 5000
    repeatable: true

  - id: "crm-get-request"
    name: "Чтение заявки исполнителем"
    method: "GET"
    path: "/api/v1/requests/{request_id}"
    role: "integration_client"
    dependsOn: ["crm-issue-key", "submit-to-own-service"]
    request:
      path:
        request_id: "${requestId}"
      headers:
        Authorization: "Bearer ${integrationApiKey}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "version", "status", "assignment", "equipment", "location"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "awaiting_provider"}
          version: {type: "integer"}
          assignment:
            type: "object"
            required: ["id", "state"]
            properties:
              state: {const: "pending"}
    timeoutMs: 5000
    repeatable: true
    extract:
      assignmentId: "$.assignment.id"
      providerVersion: "$.version"

  - id: "crm-external-reference"
    name: "Привязка номера тикета CRM к заявке"
    method: "POST"
    path: "/api/v1/requests/{request_id}/external-reference"
    role: "integration_client"
    dependsOn: ["crm-get-request"]
    request:
      path:
        request_id: "${requestId}"
      headers:
        Authorization: "Bearer ${integrationApiKey}"
        Idempotency-Key: "data-api-external-reference-${runMarker}"
        Content-Type: "application/json"
      body:
        external_id: "DATA-API-${runMarker}"
        expected_version: "${providerVersion}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "version", "status"]
      bodySchema:
        type: "object"
        properties:
          version: {type: "integer"}
    timeoutMs: 5000
    repeatable: false
    extract:
      providerVersion: "$.version"

  - id: "crm-accept"
    name: "CRM принимает заявку"
    method: "POST"
    path: "/api/v1/requests/{request_id}/accept"
    role: "integration_client"
    dependsOn: ["crm-external-reference"]
    request:
      path:
        request_id: "${requestId}"
      headers:
        Authorization: "Bearer ${integrationApiKey}"
        Idempotency-Key: "data-api-accept-${runMarker}"
        Content-Type: "application/json"
      body:
        assignment_id: "${assignmentId}"
        expected_version: "${providerVersion}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "version", "status", "assignment"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "accepted"}
          assignment:
            type: "object"
            properties:
              state: {const: "accepted"}
    timeoutMs: 5000
    repeatable: false

  - id: "customer-sees-accepted"
    name: "Заказчик видит, что сервис принял заявку"
    method: "GET"
    path: "/app-api/v1/requests/{request_id}"
    role: "customer_employee"
    dependsOn: ["crm-accept"]
    request:
      path:
        request_id: "${requestId}"
      headers:
        Authorization: "Bearer ${customerToken}"
        X-Organization-Id: "${customerOrganizationId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "status", "accepted_at", "assignment"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "accepted"}
    timeoutMs: 5000
    repeatable: true

  - id: "crm-events"
    name: "Получение событий CRM"
    method: "GET"
    path: "/api/v1/events"
    role: "integration_client"
    dependsOn: ["crm-issue-key"]
    request:
      query:
        limit: 50
      headers:
        Authorization: "Bearer ${integrationApiKey}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["events", "has_more"]
    timeoutMs: 5000
    repeatable: true

  - id: "crm-revoke-key"
    name: "Отзыв ключа, выпущенного для проверки"
    method: "POST"
    path: "/app-api/v1/integration/api-keys/{client_id}/revoke"
    role: "provider_admin"
    dependsOn: ["crm-issue-key"]
    request:
      path:
        client_id: "${integrationClientId}"
      headers:
        Authorization: "Bearer ${providerToken}"
        X-Organization-Id: "${providerOrganizationId}"
        Idempotency-Key: "data-api-revoke-key-${runMarker}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "status", "revoked_at"]
      bodySchema:
        type: "object"
        properties:
          status: {const: "revoked"}
    timeoutMs: 5000
    repeatable: false

  - id: "crm-revoked-key-rejected"
    name: "Отозванный ключ больше не принимается"
    method: "GET"
    path: "/api/v1/me"
    role: "integration_client"
    dependsOn: ["crm-revoke-key"]
    request:
      headers:
        Authorization: "Bearer ${integrationApiKey}"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["error"]
    timeoutMs: 5000
    repeatable: true

cleanup:
  - id: "revoke-check-key"
    method: "POST"
    path: "/app-api/v1/integration/api-keys/{client_id}/revoke"
    role: "provider_admin"
    request:
      path:
        client_id: "${integrationClientId}"
      headers:
        Authorization: "Bearer ${providerToken}"
        X-Organization-Id: "${providerOrganizationId}"
        Idempotency-Key: "data-api-cleanup-revoke-key-${runMarker}"
    expected:
      statusCodes: [200, 409]
    timeoutMs: 5000
