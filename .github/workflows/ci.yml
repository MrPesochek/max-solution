name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.2"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: repair
          POSTGRES_PASSWORD: repair
          POSTGRES_DB: repair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repair -d repair"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_SERVER_URL: postgresql+asyncpg://repair:repair@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  webapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webapp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run
      - run: pnpm build

  integration_1c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integration_1c
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: integration_1c/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy connector emulator
      - run: uv run pytest -q

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: compose config (demo, base, dev, prod)
        run: |
          docker compose --env-file .env.example config -q
          docker compose -f compose.yaml config -q
          docker compose -f compose.dev.yaml config -q
          sed -e 's#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=ci#' \
              -e 's#^MAX_BOT_TOKEN=.*#MAX_BOT_TOKEN=ci#' \
              -e 's#^MAX_WEBHOOK_SECRET=.*#MAX_WEBHOOK_SECRET=ci#' \
              -e 's#^SECRETS_ENCRYPTION_KEY=.*#SECRETS_ENCRYPTION_KEY=ci#' \
              .env.prod.example > "$RUNNER_TEMP/prod.env"
          docker compose --env-file "$RUNNER_TEMP/prod.env" config -q
          COMPOSE_PROFILES=onec docker compose --env-file "$RUNNER_TEMP/prod.env" config -q
      - name: shellcheck
        run: shellcheck scripts/*.sh deploy/with-secrets.sh

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, webapp, integration_1c, compose]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
            target: ""
          - name: web
            context: .
            file: deploy/web.Dockerfile
            target: ""
          - name: onec-connector
            context: integration_1c
            file: integration_1c/Dockerfile
            target: connector
          - name: onec-emulator
            context: integration_1c
            file: integration_1c/Dockerfile
            target: emulator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: repair-hub/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
