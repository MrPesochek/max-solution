[project]
name = "repair-hub-backend"
version = "0.1.0"
description = "B2B-сервис ремонта оборудования в MAX: API, бот, worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.4",
    "pillow>=11.0",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "maxapi==1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.18,<5",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"migrations/**" = ["E501"]
"app/adapters/bot/handlers/__init__.py" = ["F401"]
"app/adapters/bot/webhook.py" = ["S105"]
"app/adapters/ops/__init__.py" = ["S105"]
"app/core/clock.py" = ["E731"]
"app/core/pipeline.py" = ["S105"]
"app/infra/images/runner.py" = ["ASYNC109"]
"app/infra/net/ssrf.py" = ["ASYNC109"]
"app/modules/integration/transport.py" = ["ASYNC109", "S311"]
"migrations/env.py" = ["F403"]
"migrations/versions/0018_equipment_categories.py" = ["S608"]
"tests/conftest.py" = ["F403"]
"tests/worker/conftest.py" = ["ASYNC110"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.infra.images.runner"
disable_error_code = ["assignment", "no-any-return"]

[[tool.mypy.overrides]]
module = "app.infra.logging"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["app.core.locking", "app.modules.reputation.moderation"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "app.modules.requests.details"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "app.demo.seed"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "app.adapters.integration_api"
disable_error_code = ["method-assign"]
